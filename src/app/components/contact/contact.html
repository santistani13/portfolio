<section id="contact">
  <div class="container">
    <p class="s-label rv">{{ t().label }}</p>
    <h2 class="s-title rv">{{ t().title }}</h2>

    <div class="contact-grid">
      <div class="contact-left rv-l">
        <p class="contact-desc">
          {{ t().desc }}
        </p>
        <div class="contact-list">
          @for (link of links(); track link.label) {
            <a [href]="link.href" class="c-link" target="_blank">
              <span class="c-icon">{{ link.icon }}</span>
              {{ link.label }}
            </a>
          }
        </div>
      </div>

      <div class="contact-form rv">
        <div class="f-row">
          <div class="f-group">
            <label>{{ t().form.name }}</label>
            <input type="text" [placeholder]="t().form.namePh"
              [(ngModel)]="form.name" name="name" />
          </div>
          <div class="f-group">
            <label>{{ t().form.email }}</label>
            <input type="email" [placeholder]="t().form.emailPh"
              [(ngModel)]="form.email" name="email" />
          </div>
        </div>
        <div class="f-group">
          <label>{{ t().form.subject }}</label>
          <input type="text" [placeholder]="t().form.subjectPh"
            [(ngModel)]="form.subject" name="subject" />
        </div>
        <div class="f-group">
          <label>{{ t().form.message }}</label>
          <textarea [placeholder]="t().form.messagePh"
            [(ngModel)]="form.message" name="message"></textarea>
        </div>
        <button class="f-submit" [class]="btnClass"
          [disabled]="status === 'sending'"
          (click)="onSubmit()">
          {{ btnLabel }}
        </button>
      </div>
    </div>
  </div>
</section>

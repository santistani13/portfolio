<section id="contact">
  <div class="container">
    <p class="s-label rv">06 — contacto</p>
    <h2 class="s-title rv">Contactame</h2>

    <div class="contact-grid">
      <div class="contact-left rv-l">
        <p class="contact-desc">
          Estoy abierto a nuevas oportunidades, proyectos freelance o simplemente
          charlar sobre tecnología. Escribime y te respondo.
        </p>
        <div class="contact-list">
          @for (link of links; track link.label) {
            <a [href]="link.href" class="c-link" target="_blank">
              <span class="c-icon">{{ link.icon }}</span>
              {{ link.label }}
            </a>
          }
        </div>
      </div>

      <div class="contact-form rv">
        <div class="f-row">
          <div class="f-group">
            <label>Nombre</label>
            <input type="text" placeholder="Tu nombre"
              [(ngModel)]="form.name" name="name" />
          </div>
          <div class="f-group">
            <label>Email</label>
            <input type="email" placeholder="tu@email.com"
              [(ngModel)]="form.email" name="email" />
          </div>
        </div>
        <div class="f-group">
          <label>Asunto</label>
          <input type="text" placeholder="¿De qué se trata?"
            [(ngModel)]="form.subject" name="subject" />
        </div>
        <div class="f-group">
          <label>Mensaje</label>
          <textarea placeholder="Contame tu proyecto o propuesta..."
            [(ngModel)]="form.message" name="message"></textarea>
        </div>
        <button class="f-submit" [class]="btnClass"
          [disabled]="status === 'sending'"
          (click)="onSubmit()">
          {{ btnLabel }}
        </button>
      </div>
    </div>
  </div>
</section>

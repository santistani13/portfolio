<section id="projects">
  <div class="container">
    <p class="s-label rv">03 — proyectos</p>
    <h2 class="s-title rv">Trabajos <span class="hl">destacados</span></h2>

    <div class="projects-grid">
      @for (p of projects; track p.num) {
        <div class="p-card rv">
          <div class="p-num">{{ p.num }}</div>
          <div class="p-body">
            <div class="p-tags">
              @for (tag of p.tags; track tag) {
                <span class="p-tag">{{ tag }}</span>
              }
            </div>
            <div class="p-name">{{ p.name }}</div>
            <p class="p-desc">{{ p.desc }}</p>
          </div>
          <div class="p-foot">
            <a [href]="p.demoUrl" class="p-link" target="_blank">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>
              </svg>
              Ver proyecto
            </a>
            <a [href]="p.githubUrl" class="p-link" target="_blank">
              <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.79-.26.79-.58v-2.23c-3.34.73-4.03-1.42-4.03-1.42-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 013-.4c1.02.005 2.05.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.19.69.8.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
              </svg>
              GitHub
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</section>
